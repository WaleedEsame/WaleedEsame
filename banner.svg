<svg width="100%" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Inter:wght@300;400&amp;display=swap');

    .bg { fill: #000000; }
    .w-letter {
      font-family: 'Caveat', cursive;
      font-size: 110px;
      font-weight: 700;
      fill: #A72626;
    }
    .rest-name {
      font-family: 'Caveat', cursive;
      font-size: 95px;
      font-weight: 600;
      fill: #ffffff;
    }
    .subline {
      font-family: 'Caveat', cursive;
      font-size: 60px;
      font-weight: 600;
      fill: #ffffff;
    }
    .tagline {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 3px;
      fill: rgba(255, 255, 255, 0.6);
    }
  </style>

  <rect class="bg" width="100%" height="100%" rx="12" />

  <g transform="translate(500, 110)" text-anchor="middle">
    <text y="-10">
      <tspan class="w-letter">W</tspan>
      <tspan class="rest-name">aleed</tspan>
    </text>
  </g>


  <text x="50%" y="195" text-anchor="middle" class="tagline">
    Where design meets code...
  </text>
</svg>
