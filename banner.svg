<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&amp;family=Inter:wght@400&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="350" fill="#0a0a0a" />

  <!-- Main Title: @Waleed Esame -->
