  .bg { fill: #0b0d10; }
  
  /* Grid / Tech Background details */
  .grid-line { stroke: #1e2638; stroke-width: 0.5; opacity: 0.4; }
  .border-line { stroke: #e63946; stroke-width: 1.5; opacity: 0.6; }
  .corner-accent { fill: #e63946; }

  /* Typography */
  .top-tag {
    font-family: 'Fira Code', monospace;
    font-size: 16px;
    fill: #8b949e;
    letter-spacing: 3px;
    text-anchor: middle;
  }

  .main-text-w {
    font-family: 'Caveat', cursive;
    font-size: 110px;
    font-weight: 700;
    fill: #ff2a4b;
  }

  .main-text-rest {
    font-family: 'Caveat', cursive;
    font-size: 110px;
    font-weight: 700;
    fill: #ffffff;
  }

  .sub-text {
    font-family: 'Inter', sans-serif;
